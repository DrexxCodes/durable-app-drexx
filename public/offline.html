<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#c20e9c" />
<title>You're offline</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8f5fc;color:#1f0a33;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
  .card{max-width:360px}
  img{width:72px;height:72px;border-radius:18px;box-shadow:0 8px 24px rgba(34,6,54,.18);margin-bottom:20px}
  h1{font-size:1.4rem;margin:0 0 8px}
  p{margin:0 0 24px;color:#5a4a6b;line-height:1.5}
  button{border:0;border-radius:12px;background:#c20e9c;color:#fff;font-weight:600;font-size:1rem;padding:12px 28px}
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Check your internet connection and try again. Your wallet and transactions are safe.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
